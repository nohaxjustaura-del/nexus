# Railway: deploy this repo as the FAISS ranking API (not the Next.js app).
# Dashboard → New Project → GitHub → select NEXUS.
# If Railway still builds as Node: Settings → Build → Dockerfile path → Dockerfile.faiss
# Or leave this file; Railway often auto-detects [build].dockerfilePath when present.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.faiss"

[deploy]
# FAISS image is Python-only — do not set Start Command to `npm start` in the dashboard.
# This pins the runtime so Railway does not run Node/npm on this service.
startCommand = "/bin/sh -c 'cd /app/faiss-service && exec python -m uvicorn faiss_api:app --host 0.0.0.0 --port ${PORT:-8001}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
